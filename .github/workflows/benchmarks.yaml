name: Benchmarks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# CI-only dependency workaround, see .github/constraints.txt
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt
  UV_CONSTRAINT: ${{ github.workspace }}/.github/constraints.txt

jobs:
  benchmark:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Shared environment + run; PR runs compare and comment but never write
      # back (auto-push stays false).
      - name: Run benchmarks
        uses: ./.github/actions/run-benchmarks
        with:
          auto-push: "false"
          comment-on-alert: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
