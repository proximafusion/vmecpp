name: C++ TSAN tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Cancel currently running job if a new one comes along for the same branch or tag.
# From https://stackoverflow.com/a/72408109.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  tsan:
    name: Build and run tsan tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true  # for the mgrid test data
      # The TSAN image (clang/libomp with ThreadSanitizer support) takes ~1h to
      # build. Use the public upstream image so forks need no registry setup.
      # Refresh this digest after build_tsan_image.yaml rebuilds a changed
      # src/vmecpp/cpp/docker/tsan/ context.
      - name: Pull TSAN Docker image
        run: |
          IMAGE=ghcr.io/proximafusion/vmecpp-tsan@sha256:a00180555b9a8a79e7bae821394d82b08ce90084797a4e8cda9fcd074243220f
          docker pull "$IMAGE"
          docker tag "$IMAGE" proximafusion/tsan
      - name: Restore bazel cache
        uses: actions/cache/restore@v4
        with:
          path: "~/.cache/bazel"
          key: bazel-tsan-${{ github.sha }}
          restore-keys: bazel-tsan
      - name: Run TSAN tests in Docker
        run: |
          mkdir -p ~/.cache/bazel
          docker run --rm \
            -v ${{ github.workspace }}:/vmecpp \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/home -e USER=root \
            -v ~/.cache:/tmp/home/.cache \
            proximafusion/tsan \
            bash -c "cd /vmecpp/src/vmecpp/cpp && bazel test --config=tsan_archer_in_docker --jobs=1 --test_output=errors -- //vmecpp/... -//vmecpp/vmec/pybind11/..."
      # Entries are immutable: a new key per main commit refreshes the cache, GitHub evicts old ones.
      - name: Save bazel cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: "~/.cache/bazel"
          key: bazel-tsan-${{ github.sha }}
